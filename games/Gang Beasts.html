<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/jmhq20120212-cmd/GangBeast-WebPort@main/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Gang Beasts</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      #unity-container {
        width: 100% !important;
        height: 100% !important;
        position: absolute;
        top: 0;
        left: 0;
      }
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-mobile-warning">
        WebGL builds are not supported on mobile devices.
      </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Gang Beasts</div>
      </div>
    </div>
    <script src="game-data.js"></script>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGLValidation.loader.js";
      var config = {
        dataUrl: buildUrl + "/WebGLValidation.data",
        frameworkUrl: buildUrl + "/WebGLValidation.framework.js",
        codeUrl: "https://raw.githubusercontent.com/jmhq20120212-cmd/GangBeast-WebPort/main/Build/WebGLValidation.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Boneloaf",
        productName: "Gang Beasts",
        productVersion: "1.0",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var mobileWarning = document.querySelector("#unity-mobile-warning");

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1;
        mobileWarning.style.display = "block";
        setTimeout(() => {
          mobileWarning.style.display = "none";
        }, 5000);
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = async () => {
        var dataBlobUrl;
        try {
          dataBlobUrl = await loadGameData("Build/data-manifest.json", (progress) => {
            progressBarFull.style.width = (80 * progress) + "%";
          });
          config.dataUrl = dataBlobUrl;
          await createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = (80 + 20 * progress) + "%";
          }).then((unityInstance) => {
            loadingBar.style.display = "none";
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          });
        } catch (error) {
          console.error(error);
          alert("error! " + error.message);
        } finally {
          if (dataBlobUrl) URL.revokeObjectURL(dataBlobUrl);
        }
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
