name: update game list

# drop a game html (and its picture) into games/, push, and the hub picks it up

on:
  push:
    branches: [main]
    paths:
      - "games/**"
      - "build_games.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: rebuild games.json
        run: python build_games.py

      - name: commit it if it changed
        run: |
          if git diff --quiet -- games.json; then
            echo "game list already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json
          git commit -m "update game list"
          git push
